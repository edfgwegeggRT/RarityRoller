<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rarity Roller Game</title>
    <link rel="stylesheet" href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 text-center">
                <h1 class="mb-4">Rarity Roller</h1>

                <div class="card mb-4">
                    <div class="card-body">
                        <div id="stats" class="mb-3">
                            <div class="row">
                                <div class="col">
                                    <h5>Rolls: <span id="roll-count">{{ roll_count }}</span></h5>
                                </div>
                                <div class="col">
                                    <h5>Luck Bonus: <span id="luck-bonus">{{ luck_bonus }}x</span></h5>
                                </div>
                            </div>
                        </div>

                        <div id="result-display" class="mb-4">
                            <h2 class="display-4" id="rarity-text">Roll to Begin!</h2>
                            <div class="spinner-border d-none" id="spinner" role="status">
                                <span class="visually-hidden">Rolling...</span>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button id="roll-button" class="btn btn-primary btn-lg">
                                <i class="fas fa-dice me-2"></i>Roll!
                            </button>
                            <button id="auto-roll-button" class="btn btn-secondary btn-lg {% if not can_auto_roll %}disabled{% endif %}" 
                                    {% if not can_auto_roll %}disabled{% endif %}>
                                <i class="fas fa-sync-alt me-2"></i>Auto Roll
                                {% if not can_auto_roll %}
                                    <small>(Unlocks at 50 rolls)</small>
                                {% endif %}
                            </button>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h3>Rarity Tiers</h3>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Rarity</th>
                                        <th>Base Chance</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {% for rarity, info in rarity_tiers.items() %}
                                    <tr>
                                        <td>
                                            <div class="position-relative d-inline-block">
                                                {% if rarity == "Uncommon" %}
                                                <button id="secret-button" class="secret-button"></button>
                                                {% endif %}
                                                <span class="badge" style="background-color: {{ info.color }}">
                                                    {{ rarity }}
                                                </span>
                                            </div>
                                        </td>
                                        <td>1 in {{ info.chance }}</td>
                                    </tr>
                                    {% endfor %}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/roller.js') }}"></script>
</body>
</html>
